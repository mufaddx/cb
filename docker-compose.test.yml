version: "3.9"

# Disposable MySQL for integration tests — separate port/volume from
# the dev stack in docker-compose.yml so `npm test` never touches
# development data.
services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: antigravity_test
      MYSQL_USER: antigravity
      MYSQL_PASSWORD: antigravity
      MYSQL_ROOT_PASSWORD: test-root-password
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptest-root-password"]
      interval: 3s
      timeout: 5s
      retries: 30
